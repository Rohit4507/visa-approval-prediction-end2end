[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "us-visa"
version = "0.2.0"
description = "End-to-end MLOps pipeline that predicts US visa application approval"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Rohit Singh Rajput", email = "rohitrajput33220@gmail.com" }]
keywords = [
    "machine-learning",
    "mlops",
    "fastapi",
    "docker",
    "cicd",
    "visa-approval-prediction",
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
]

dependencies = [
    # web service
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.9,<3.0",
    # data
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "scipy>=1.14,<2.0",
    "pyyaml>=6.0,<7.0",
    # modelling
    "scikit-learn>=1.5,<2.0",
    "imbalanced-learn>=0.12,<1.0",
    "xgboost>=2.1,<4.0",
    "catboost>=1.2,<2.0",
    "joblib>=1.4,<2.0",
    # monitoring
    "evidently>=0.7,<0.8",
    # storage and cloud access
    "pymongo>=4.9,<5.0",
    "certifi>=2024.8.30",
    "boto3>=1.35,<2.0",
    "botocore>=1.35,<2.0",
]

[project.optional-dependencies]
notebooks = [
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "plotly>=5.24",
    "seaborn>=0.13",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.11",
    "mypy-boto3-s3>=1.35",
    "types-PyYAML>=6.0",
    "pre-commit>=4.0",
]

[project.urls]
Repository = "https://github.com/Rohit4507/visa-approval-prediction-end2end"
Issues = "https://github.com/Rohit4507/visa-approval-prediction-end2end/issues"
Changelog = "https://github.com/Rohit4507/visa-approval-prediction-end2end/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["us_visa"]

[tool.uv]
default-groups = ["dev"]
# Local/CI always use an interpreter that already exists; never fetch a managed build.
python-preference = "only-system"

# ---------------------------------------------------------------------------
# Linting and formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebook"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # line length is enforced by the formatter
    "B008",   # function call in default argument (FastAPI Depends pattern)
    "RUF001", # ambiguous unicode in docstrings
]

[tool.ruff.lint.isort]
known-first-party = ["us_visa"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# Static typing (ratcheted: the package is fully typed from PR 1 onward)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["us_visa"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["imblearn.*", "evidently.*"]
ignore_missing_imports = true

# S3 helper is removed in PR 4 (MLflow registry replaces it); do not spend typing
# effort on code that is about to be deleted.
[[tool.mypy.overrides]]
module = ["us_visa.cloud_storage.aws_storage"]
ignore_errors = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["us_visa"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
# Ratchet upwards as components gain tests (see docs/ROADMAP_2026.md).
fail_under = 48
