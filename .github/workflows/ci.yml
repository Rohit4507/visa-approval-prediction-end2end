name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types and tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies from the lockfile
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy

      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=term-missing

      - name: Upload coverage report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
          if-no-files-found: ignore

  repo-hygiene:
    name: Config, notebooks and secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml

      - name: Validate YAML configuration
        run: |
          python - <<'PY'
          import yaml
          for path in (
              "config/model.yaml",
              "config/schema.yaml",
              ".github/workflows/aws.yaml",
              ".github/workflows/ci.yml",
          ):
              with open(path) as fh:
                  yaml.safe_load(fh)
              print(f"OK  {path}")
          PY

      - name: Validate notebooks are well-formed JSON
        run: |
          python - <<'PY'
          import glob
          import json
          import sys

          bad = []
          for path in glob.glob("notebook/*.ipynb"):
              try:
                  json.load(open(path, encoding="utf-8"))
                  print(f"OK  {path}")
              except Exception as exc:
                  bad.append(f"{path}: {exc}")

          if bad:
              print("\n".join(bad))
              sys.exit(1)
          PY

      - name: Check for accidentally committed credentials
        run: |
          if grep -rIn --exclude-dir=.git --exclude-dir=.venv -E \
              "(AKIA[0-9A-Z]{16}|mongodb\+srv://[^<][^:]*:[^<][^@]*@)" . ; then
            echo "::error::A connection string or AWS access key looks hardcoded. Use environment variables."
            exit 1
          fi
          echo "No hardcoded credentials found."
